services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: hourboard
      POSTGRES_USER: hourboard
      POSTGRES_PASSWORD: hourboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hourboard -d hourboard"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
