name: hourboard-prod

services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=hourboard-prod_edge
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.duckdns.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in deploy/production.env}
      - --certificatesresolvers.duckdns.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.duckdns.acme.dnschallenge=true
      - --certificatesresolvers.duckdns.acme.dnschallenge.provider=duckdns
    environment:
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?Set DUCKDNS_TOKEN in deploy/production.env}
    ports:
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/letsencrypt
    networks:
      - edge

  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: hourboard
      POSTGRES_USER: hourboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/production.env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hourboard -d hourboard"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - data

  migrate:
    image: hourboard:phase4b
    command: ["node", "dist/db/migrate.js"]
    restart: "no"
    environment: &app_environment
      NODE_ENV: production
      PORT: "3000"
      DATABASE_HOST: db
      DATABASE_USER: hourboard
      DATABASE_NAME: hourboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/production.env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: hourboard:phase4b
    restart: unless-stopped
    environment: *app_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    labels:
      traefik.enable: "true"
      traefik.docker.network: hourboard-prod_edge
      traefik.http.routers.hourboard.rule: "Host(`hourboard.duckdns.org`)"
      traefik.http.routers.hourboard.entrypoints: websecure
      traefik.http.routers.hourboard.tls.certresolver: duckdns
      traefik.http.routers.hourboard.service: hourboard
      traefik.http.routers.hourboard-attempts.rule: "Host(`hourboard.duckdns.org`) && Path(`/api/attempts`) && Method(`POST`)"
      traefik.http.routers.hourboard-attempts.entrypoints: websecure
      traefik.http.routers.hourboard-attempts.priority: "100"
      traefik.http.routers.hourboard-attempts.tls.certresolver: duckdns
      traefik.http.routers.hourboard-attempts.service: hourboard
      traefik.http.routers.hourboard-attempts.middlewares: hourboard-attempt-limit
      traefik.http.middlewares.hourboard-attempt-limit.ratelimit.average: "30"
      traefik.http.middlewares.hourboard-attempt-limit.ratelimit.period: 1s
      traefik.http.middlewares.hourboard-attempt-limit.ratelimit.burst: "150"
      traefik.http.services.hourboard.loadbalancer.server.port: "3000"
    networks:
      - edge
      - data

  duckdns-updater:
    image: hourboard:phase4b
    command: ["node", "scripts/duckdns-updater.mjs"]
    restart: unless-stopped
    environment:
      DUCKDNS_DOMAIN: hourboard
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?Set DUCKDNS_TOKEN in deploy/production.env}
      DUCKDNS_INTERVAL_SECONDS: "300"
    networks:
      - ddns

networks:
  edge:
    name: hourboard-prod_edge
  data:
    name: hourboard-prod_data
    internal: true
  ddns:
    name: hourboard-prod_ddns

volumes:
  postgres_data:
  traefik_acme:
