name: hourboard-prod

services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=hourboard-prod_edge
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.duckdns.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in the external production environment file}
      - --certificatesresolvers.duckdns.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.duckdns.acme.dnschallenge=true
      - --certificatesresolvers.duckdns.acme.dnschallenge.provider=duckdns
    environment:
      DUCKDNS_TOKEN_FILE: /run/secrets/duckdns_token
    ports:
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/letsencrypt
    secrets:
      - duckdns_token
    networks:
      - edge

  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: hourboard
      POSTGRES_USER: hourboard
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hourboard -d hourboard"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - data

  migrate:
    image: hourboard:phase4b
    command: ["node", "dist/db/migrate.js"]
    restart: "no"
    environment: &app_environment
      NODE_ENV: production
      PORT: "3000"
      DATABASE_HOST: db
      DATABASE_USER: hourboard
      DATABASE_NAME: hourboard
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: hourboard:phase4b
    restart: unless-stopped
    environment: *app_environment
    secrets:
      - db_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    labels:
      traefik.enable: "true"
      traefik.docker.network: hourboard-prod_edge
      traefik.http.routers.hourboard.rule: "Host(`hourboard.duckdns.org`)"
      traefik.http.routers.hourboard.entrypoints: websecure
      traefik.http.routers.hourboard.tls.certresolver: duckdns
      traefik.http.services.hourboard.loadbalancer.server.port: "3000"
    networks:
      - edge
      - data

  duckdns-updater:
    image: hourboard:phase4b
    command: ["node", "scripts/duckdns-updater.mjs"]
    restart: unless-stopped
    environment:
      DUCKDNS_DOMAIN: hourboard
      DUCKDNS_TOKEN_FILE: /run/secrets/duckdns_token
      DUCKDNS_INTERVAL_SECONDS: "300"
    secrets:
      - duckdns_token
    networks:
      - ddns

networks:
  edge:
    name: hourboard-prod_edge
  data:
    name: hourboard-prod_data
    internal: true
  ddns:
    name: hourboard-prod_ddns

volumes:
  postgres_data:
  traefik_acme:

secrets:
  db_password:
    file: ${HOURBOARD_SECRET_DIR:?Set HOURBOARD_SECRET_DIR in the external production environment file}/db_password
  duckdns_token:
    file: ${HOURBOARD_SECRET_DIR:?Set HOURBOARD_SECRET_DIR in the external production environment file}/duckdns_token
