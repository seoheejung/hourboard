<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#121a1d">
    <meta name="description" content="요청하신 HourBoard 페이지를 찾을 수 없습니다. 메인 화면으로 돌아가 현재 전광판을 확인하세요.">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/styles/app.css">

  <body>
    <main class="layout not-found-layout">
      <header class="site-header">
        <a class="brand" href="/" aria-label="HourBoard 홈으로 이동">

        <h1 id="not-found-title">페이지를 찾을 수 없습니다.</h1>
        <p>주소를 다시 확인하거나 현재 전광판으로 돌아가 주세요.</p>
        <a class="back-link" href="/">메인 화면으로 돌아가기</a>
      </section>

</html>
